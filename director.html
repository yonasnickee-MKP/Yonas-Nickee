<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Yonas Director Mode</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at center,
                    #210044,
                    #06000c 60%,
                    #000
                );

            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .game {
            width: 100%;
            max-width: 1100px;
            padding: 25px;
            text-align: center;
        }

        .title {
            font-size: 12px;
            letter-spacing: 5px;
            color: #b85cff;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(35px, 7vw, 80px);
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            font-size: 13px;
            margin-bottom: 35px;
        }

        .scene {
            position: relative;

            width: 100%;
            height: min(55vh, 550px);

            border-radius: 25px;

            overflow: hidden;

            border:
                1px solid rgba(181, 76, 255, .4);

            background:
                linear-gradient(
                    135deg,
                    #12001f,
                    #030006
                );

            box-shadow:
                0 0 50px
                rgba(146, 35, 255, .2);
        }

        .scene::before {
            content: "";

            position: absolute;

            width: 250px;
            height: 250px;

            border-radius: 50%;

            background: #8d22ff;

            filter: blur(100px);

            opacity: .25;

            left: 20%;
            top: 20%;
        }

        .subject {
            position: absolute;

            width: 90px;
            height: 160px;

            background:
                linear-gradient(
                    180deg,
                    #d15cff,
                    #5010a0
                );

            border-radius: 45px 45px 20px 20px;

            left: 15%;
            bottom: 20%;

            box-shadow:
                0 0 40px
                rgba(190, 60, 255, .6);

            animation:
                walk 6s linear infinite;
        }

        @keyframes walk {

            0% {
                left: 10%;
            }

            50% {
                left: 75%;
            }

            100% {
                left: 10%;
            }

        }

        .camera-label {
            position: absolute;

            top: 20px;
            left: 25px;

            padding: 8px 15px;

            border-radius: 50px;

            background:
                rgba(0, 0, 0, .5);

            border:
                1px solid
                rgba(255,255,255,.1);

            font-size: 10px;

            letter-spacing: 2px;
        }

        .score {
            margin: 20px 0;

            font-size: 14px;

            color: #00eaff;
        }

        .controls {

            display: flex;

            justify-content: center;

            gap: 10px;

            flex-wrap: wrap;

            margin-top: 20px;
        }

        button {

            padding: 13px 20px;

            border-radius: 50px;

            border:
                1px solid
                rgba(180,70,255,.4);

            background:
                rgba(120,0,255,.1);

            color: white;

            cursor: pointer;

            font-size: 10px;

            letter-spacing: 2px;

            transition: .3s;
        }

        button:hover {

            background:
                rgba(160,40,255,.3);

            box-shadow:
                0 0 25px
                rgba(160,40,255,.5);

            transform:
                translateY(-3px);
        }

    </style>
</head>


<body>

    <div class="game">

        <div class="title">
            YONAS NICKEE PRESENTS
        </div>

        <h1>
            DIRECTOR MODE
        </h1>

        <div class="subtitle">
            Create the perfect shot.
        </div>


        <div class="scene">

            <div class="camera-label"
                 id="cameraLabel">

                CAM 01 • WIDE SHOT

            </div>


            <div class="subject"></div>

        </div>


        <div class="score">

            SCORE:
            <span id="score">
                0
            </span>

        </div>


        <div class="controls">

            <button onclick="cameraOne()">
                CAM 01
            </button>

            <button onclick="cameraTwo()">
                CAM 02
            </button>

            <button onclick="cameraThree()">
                CAM 03
            </button>

            <button onclick="zoomShot()">
                ZOOM
            </button>

            <button onclick="slowMotion()">
                SLOW MO
            </button>

        </div>

    </div>


    <script>

        let score = 0;


        function addScore(points) {

            score += points;

            document.getElementById("score")
                .textContent = score;

        }


        function cameraOne() {

            document.getElementById("cameraLabel")
                .textContent =
                "CAM 01 • WIDE SHOT";

            addScore(100);

        }


        function cameraTwo() {

            document.getElementById("cameraLabel")
                .textContent =
                "CAM 02 • CLOSE UP";

            addScore(100);

        }


        function cameraThree() {

            document.getElementById("cameraLabel")
                .textContent =
                "CAM 03 • SIDE ANGLE";

            addScore(100);

        }


        function zoomShot() {

            document.getElementById("cameraLabel")
                .textContent =
                "CINEMATIC ZOOM";

            addScore(150);

        }


        function slowMotion() {

            document.getElementById("cameraLabel")
                .textContent =
                "SLOW MOTION";

            addScore(200);

        }

    </script>

</body>

</html>
