<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yonas Director Mode</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#030006;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

/* INTRO */

#intro{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
    radial-gradient(circle at center,#350064,#030006 65%);
}

.intro-box{
    width:90%;
    max-width:650px;
}

.small-title{
    color:#00eaff;
    font-size:11px;
    letter-spacing:6px;
    margin-bottom:20px;
}

.intro-box h1{
    font-size:clamp(40px,10vw,90px);
    letter-spacing:5px;
    background:linear-gradient(90deg,#fff,#d65cff,#00eaff);
    -webkit-background-clip:text;
    color:transparent;
}

.intro-box p{
    color:#aaa;
    margin-top:15px;
    letter-spacing:2px;
}

.start{
    margin-top:35px;
    padding:16px 35px;
    border:0;
    border-radius:50px;
    color:white;
    background:linear-gradient(90deg,#8b2cff,#00bfff);
    cursor:pointer;
    font-weight:bold;
    letter-spacing:2px;
    box-shadow:0 0 30px #752cff;
}

/* GAME */

#game{
    display:none;
    width:100%;
    height:100vh;
    padding:15px;
}

.top{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
}

.logo{
    color:#00eaff;
    letter-spacing:3px;
    font-size:12px;
}

.stats{
    display:flex;
    gap:20px;
    font-size:11px;
    color:#aaa;
}

.stats span{
    color:white;
}

/* CINEMA */

.cinema{
    position:relative;
    width:100%;
    height:calc(100vh - 190px);
    min-height:400px;
    overflow:hidden;
    border-radius:25px;
    background:
    linear-gradient(
        120deg,
        #12001d,
        #020006
    );
    border:1px solid rgba(180,70,255,.4);
    box-shadow:
    0 0 60px rgba(140,30,255,.25);
}

/* LIGHT */

.light{
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:#8d20ff;
    filter:blur(100px);
    opacity:.25;
    left:20%;
    top:10%;
}

/* FLOOR */

.floor{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:28%;
    background:
    linear-gradient(
        180deg,
        #16001f,
        #020003
    );
}

/* SUBJECT */

.subject{
    position:absolute;
    width:70px;
    height:130px;
    left:8%;
    bottom:23%;
    transition:.3s;
}

.head{
    width:45px;
    height:45px;
    margin:auto;
    border-radius:50%;
    background:#d99070;
    box-shadow:0 0 20px rgba(255,160,100,.4);
}

.body{
    width:70px;
    height:85px;
    margin:auto;
    margin-top:3px;
    border-radius:30px 30px 10px 10px;
    background:linear-gradient(#9b35ff,#3b0878);
    box-shadow:0 0 30px rgba(170,50,255,.5);
}

/* WALK */

.walk{
    animation:walk 7s linear infinite;
}

@keyframes walk{

    0%{left:5%}
    50%{left:80%}
    100%{left:5%}

}

/* CAMERA */

.camera-info{
    position:absolute;
    top:20px;
    left:20px;
    z-index:5;
}

.camera-name{
    font-size:12px;
    letter-spacing:3px;
    color:#00eaff;
}

.camera-type{
    font-size:9px;
    color:#888;
    margin-top:5px;
}

/* TARGET */

.target-box{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    text-align:center;
}

.target-label{
    font-size:9px;
    color:#888;
    letter-spacing:3px;
}

.target{
    margin-top:6px;
    font-size:20px;
    color:#fff;
    text-shadow:0 0 20px #00eaff;
}

.signal{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:20;
    pointer-events:none;
}

.signal-text{
    padding:15px 30px;
    border-radius:50px;
    background:rgba(0,255,200,.12);
    border:1px solid #00ffc8;
    color:#00ffc8;
    font-size:18px;
    font-weight:bold;
    letter-spacing:3px;
    box-shadow:0 0 40px rgba(0,255,200,.5);
}

/* CONTROLS */

.controls{
    height:90px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

.control{
    min-width:90px;
    padding:13px 15px;
    border-radius:50px;
    border:1px solid rgba(180,70,255,.4);
    background:rgba(100,20,180,.12);
    color:white;
    cursor:pointer;
    font-size:9px;
    letter-spacing:1px;
    transition:.2s;
}

.control:hover{
    transform:translateY(-3px);
    box-shadow:0 0 25px rgba(170,50,255,.6);
}

.correct{
    background:#00b894 !important;
    box-shadow:0 0 35px #00ffc8 !important;
}

.wrong{
    background:#d40058 !important;
    box-shadow:0 0 35px #ff006a !important;
}

/* MESSAGE */

#message{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:100;
    display:none;
    text-align:center;
    pointer-events:none;
}

.message-main{
    font-size:35px;
    font-weight:bold;
    letter-spacing:3px;
}

.message-sub{
    margin-top:10px;
    color:#00eaff;
}

/* RESULT */

#result{
    position:fixed;
    inset:0;
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
    radial-gradient(circle,#30005a,#020003 65%);
}

.result-box{
    width:90%;
    max-width:600px;
    padding:40px;
    border-radius:30px;
    border:1px solid rgba(200,80,255,.5);
    background:rgba(10,0,20,.85);
    box-shadow:0 0 70px rgba(150,30,255,.4);
}

.result-box h1{
    font-size:clamp(35px,8vw,70px);
    background:linear-gradient(90deg,#fff,#d65cff,#00eaff);
    -webkit-background-clip:text;
    color:transparent;
}

.final-score{
    font-size:50px;
    margin:20px;
    color:#00eaff;
}

.rank{
    color:#ffcf4a;
    letter-spacing:5px;
}

.play-again{
    margin-top:30px;
    padding:14px 30px;
    border:0;
    border-radius:50px;
    background:linear-gradient(90deg,#8b2cff,#00bfff);
    color:white;
    cursor:pointer;
}

@media(max-width:600px){

    .stats{
        gap:8px;
        font-size:9px;
    }

    .cinema{
        height:calc(100vh - 205px);
        min-height:350px;
    }

    .controls{
        height:105px;
    }

    .control{
        min-width:75px;
        padding:11px 8px;
        font-size:8px;
    }

}

</style>
</head>

<body>

<!-- INTRO -->

<div id="intro">

    <div class="intro-box">

        <div class="small-title">
            YONAS NICKEE PRESENTS
        </div>

        <h1>
            DIRECTOR MODE
        </h1>

        <p>
            DON'T JUST WATCH THE SCENE.
            <br>
            DIRECT IT.
        </p>

        <button class="start" onclick="startGame()">
            START MISSION 🎬
        </button>

    </div>

</div>


<!-- GAME -->

<div id="game">

    <div class="top">

        <div class="logo">
            YONAS // DIRECTOR
        </div>

        <div class="stats">

            <div>
                TIME
                <span id="time">30</span>
            </div>

            <div>
                SCORE
                <span id="score">0</span>
            </div>

            <div>
                COMBO
                <span id="combo">0</span>
            </div>

        </div>

    </div>


    <div class="cinema">

        <div class="light"></div>

        <div class="floor"></div>

        <div class="camera-info">

            <div class="camera-name" id="camera">
                CAM 01
            </div>

            <div class="camera-type" id="cameraType">
                WIDE SHOT
            </div>

        </div>


        <div class="target-box">

            <div class="target-label">
                NEXT SHOT
            </div>

            <div class="target" id="target">
                CAM 02
            </div>

        </div>


        <div class="subject walk" id="subject">

            <div class="head"></div>

            <div class="body"></div>

        </div>


        <div class="signal" id="signal">

            <div class="signal-text">
                SWITCH NOW!
            </div>

        </div>

    </div>


    <div class="controls">

        <button class="control" onclick="choose('CAM 01',this)">
            CAM 01
        </button>

        <button class="control" onclick="choose('CAM 02',this)">
            CAM 02
        </button>

        <button class="control" onclick="choose('CAM 03',this)">
            CAM 03
        </button>

        <button class="control" onclick="choose('ZOOM',this)">
            ZOOM
        </button>

        <button class="control" onclick="choose('SLOW MO',this)">
            SLOW MO
        </button>

    </div>

</div>


<!-- MESSAGE -->

<div id="message">

    <div class="message-main" id="messageMain">
        PERFECT CUT!
    </div>

    <div class="message-sub" id="messageSub">
        +500
    </div>

</div>


<!-- RESULT -->

<div id="result">

    <div class="result-box">

        <div class="small-title">
            MISSION COMPLETE
        </div>

        <h1>
            YOUR CUT
        </h1>

        <div class="final-score" id="finalScore">
            0
        </div>

        <div class="rank" id="rank">
            ROOKIE DIRECTOR
        </div>

        <button class="play-again" onclick="location.reload()">
            PLAY AGAIN 🎬
        </button>

    </div>

</div>


<script>

let score = 0;

let time = 30;

let combo = 0;

let playing = false;

let target = "CAM 02";

let timer;


/* SHOTS */

const shots = [
    "CAM 01",
    "CAM 02",
    "CAM 03",
    "ZOOM",
    "SLOW MO"
];


/* CAMERA DATA */

const cameraData = {

    "CAM 01":{
        name:"CAM 01",
        type:"WIDE SHOT"
    },

    "CAM 02":{
        name:"CAM 02",
        type:"CLOSE UP"
    },

    "CAM 03":{
        name:"CAM 03",
        type:"SIDE ANGLE"
    },

    "ZOOM":{
        name:"ZOOM",
        type:"CINEMATIC ZOOM"
    },

    "SLOW MO":{
        name:"SLOW MO",
        type:"SLOW MOTION"

    }

};


/* START */

function startGame(){

    document.getElementById("intro")
        .style.display="none";

    document.getElementById("game")
        .style.display="block";

    playing=true;

    score=0;

    time=30;

    combo=0;

    document.getElementById("score")
        .textContent=score;

    document.getElementById("time")
        .textContent=time;

    document.getElementById("combo")
        .textContent=combo;

    newTarget();

    timer=setInterval(countDown,1000);

}


/* TIMER */

function countDown(){

    if(!playing) return;

    time--;

    document.getElementById("time")
        .textContent=time;

    if(time<=0){

        endGame();

    }

}


/* TARGET */

function newTarget(){

    target=
        shots[
            Math.floor(
                Math.random()*shots.length
            )
        ];

    document.getElementById("target")
        .textContent=target;

}


/* CHOOSE */

function choose(shot,button){

    if(!playing) return;

    if(shot===target){

        combo++;

        let points=500+(combo*100);

        score+=points;

        button.classList.add("correct");

        showMessage(
            "PERFECT CUT!",
            "+"+points
        );

        cameraChange(shot);

        setTimeout(function(){

            button.classList.remove("correct");

        },400);

    }else{

        combo=0;

        score-=100;

        if(score<0) score=0;

        button.classList.add("wrong");

        showMessage(
            "MISSED!",
            "-100"
        );

        setTimeout(function(){

            button.classList.remove("wrong");

        },400);

    }

    document.getElementById("score")
        .textContent=score;

    document.getElementById("combo")
        .textContent=combo;

    newTarget();

}


/* CAMERA */

function cameraChange(shot){

    let data=cameraData[shot];

    document.getElementById("camera")
        .textContent=data.name;

    document.getElementById("cameraType")
        .textContent=data.type;


    let subject=
        document.getElementById("subject");


    if(shot==="ZOOM"){

        subject.style.transform="scale(2)";

        setTimeout(function(){

            subject.style.transform="scale(1)";

        },700);

    }


    if(shot==="SLOW MO"){

        subject.style.animationDuration="16s";

        setTimeout(function(){

            subject.style.animationDuration="7s";

        },1200);

    }

}


/* MESSAGE */

function showMessage(main,sub){

    document.getElementById("messageMain")
        .textContent=main;

    document.getElementById("messageSub")
        .textContent=sub;

    let box=
        document.getElementById("message");

    box.style.display="block";

    setTimeout(function(){

        box.style.display="none";

    },600);

}


/* END */

function endGame(){

    playing=false;

    clearInterval(timer);

    document.getElementById("game")
        .style.display="none";

    document.getElementById("result")
        .style.display="flex";

    document.getElementById("finalScore")
        .textContent=score;


    let rank="ROOKIE DIRECTOR";

    if(score>=8000){

        rank="MASTER DIRECTOR ★★★★★";

    }else if(score>=5000){

        rank="PRO DIRECTOR ★★★★";

    }else if(score>=2500){

        rank="RISING DIRECTOR ★★★";

    }else if(score>=1000){

        rank="ASSISTANT DIRECTOR ★★";

    }


    document.getElementById("rank")
        .textContent=rank;

}

</script>

</body>
</html>
